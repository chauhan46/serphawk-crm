<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#ffffff"/>

  <text x="600" y="45" text-anchor="middle"
        font-family="Arial" font-size="28" font-weight="bold">
    SERP Hawk CRM - AWS Deployment Architecture
  </text>

  <!-- Internet -->
  <rect x="470" y="80" width="260" height="65" rx="10"
        fill="#f3f3f3" stroke="#333" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle"
        font-family="Arial" font-size="22" font-weight="bold">
    Internet / Users
  </text>

  <line x1="600" y1="145" x2="600" y2="190"
        stroke="#333" stroke-width="3"/>
  <polygon points="600,200 590,185 610,185" fill="#333"/>

  <!-- EC2 -->
  <rect x="120" y="200" width="960" height="440" rx="18"
        fill="#f8f8f8" stroke="#333" stroke-width="3"/>

  <text x="600" y="235" text-anchor="middle"
        font-family="Arial" font-size="25" font-weight="bold">
    Amazon EC2 - serphawk-crm
  </text>

  <text x="600" y="265" text-anchor="middle"
        font-family="Arial" font-size="16">
    Amazon Linux 2023 | t2.micro | Security Group
  </text>

  <!-- Frontend -->
  <rect x="170" y="310" width="260" height="120" rx="12"
        fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="300" y="345" text-anchor="middle"
        font-family="Arial" font-size="21" font-weight="bold">
    Next.js Frontend
  </text>
  <text x="300" y="375" text-anchor="middle"
        font-family="Arial" font-size="17">
    Docker Container
  </text>
  <text x="300" y="402" text-anchor="middle"
        font-family="Arial" font-size="17">
    Port 3000
  </text>

  <!-- Backend -->
  <rect x="470" y="310" width="260" height="120" rx="12"
        fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="345" text-anchor="middle"
        font-family="Arial" font-size="21" font-weight="bold">
    FastAPI Backend
  </text>
  <text x="600" y="375" text-anchor="middle"
        font-family="Arial" font-size="17">
    Docker Container
  </text>
  <text x="600" y="402" text-anchor="middle"
        font-family="Arial" font-size="17">
    Port 8000
  </text>

  <!-- PostgreSQL -->
  <rect x="770" y="310" width="260" height="120" rx="12"
        fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="900" y="345" text-anchor="middle"
        font-family="Arial" font-size="21" font-weight="bold">
    PostgreSQL
  </text>
  <text x="900" y="375" text-anchor="middle"
        font-family="Arial" font-size="17">
    Docker Container
  </text>
  <text x="900" y="402" text-anchor="middle"
        font-family="Arial" font-size="17">
    Port 5432
  </text>

  <!-- Arrows -->
  <line x1="430" y1="370" x2="470" y2="370"
        stroke="#333" stroke-width="3"/>
  <polygon points="470,370 455,362 455,378" fill="#333"/>

  <line x1="730" y1="370" x2="770" y2="370"
        stroke="#333" stroke-width="3"/>
  <polygon points="770,370 755,362 755,378" fill="#333"/>

  <!-- Docker Compose -->
  <rect x="350" y="475" width="500" height="70" rx="10"
        fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="518" text-anchor="middle"
        font-family="Arial" font-size="21" font-weight="bold">
    Docker Compose
  </text>

  <!-- EBS -->
  <rect x="430" y="575" width="340" height="45" rx="8"
        fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="604" text-anchor="middle"
        font-family="Arial" font-size="18" font-weight="bold">
    Amazon EBS - EC2 Storage
  </text>

  <!-- Ports -->
  <text x="600" y="690" text-anchor="middle"
        font-family="Arial" font-size="16">
    Security Group: SSH 22 | Frontend 3000 | Backend 8000
  </text>

  <text x="600" y="720" text-anchor="middle"
        font-family="Arial" font-size="15">
    Deployment: Docker + Docker Compose on Amazon EC2
  </text>
</svg>
